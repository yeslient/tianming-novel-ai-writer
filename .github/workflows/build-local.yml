name: Build Local Mode

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore "Core/App/天命.csproj"

      - name: Publish Single File
        run: |
          dotnet publish "Core/App/天命.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o ./publish

      - name: Create local.mode
        run: New-Item -Path ./publish/local.mode -ItemType File -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tianming-Local-Mode
          path: ./publish/ 
